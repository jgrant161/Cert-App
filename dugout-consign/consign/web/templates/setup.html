{% extends "base.html" %}{% block title %}Set up{% endblock %}
{% block body %}
<div class="card" style="max-width:460px;margin:30px auto">
  <h1>Set up the portal</h1>
  <p class="muted">Create the owner account. You can add staff and consignors after.</p>
  <form method="post">
    <label>Your name<input name="name" required autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password (10+ characters)<input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
    <label>Password again<input name="confirm" type="password" required autocomplete="new-password"></label>
    {% if need_token %}<label>Setup code<input name="setup_token" required></label>{% endif %}
    <button>Create owner account</button>
  </form>
</div>
{% endblock %}
