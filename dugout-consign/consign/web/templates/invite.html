{% extends "base.html" %}{% block title %}Set your password{% endblock %}
{% block body %}
<div class="card" style="max-width:440px;margin:30px auto">
  <h1>Welcome, {{ invitee.name }}</h1>
  <p class="muted">Choose a password for <b>{{ invitee.email }}</b>.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Password (10+ characters)<input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
    <label>Password again<input name="confirm" type="password" required autocomplete="new-password"></label>
    <button>Save and sign in</button>
  </form>
</div>
{% endblock %}
