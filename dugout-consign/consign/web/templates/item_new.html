{% extends "base.html" %}{% block title %}Check in an item{% endblock %}
{% block body %}
<h1>Check in an item</h1>
<p class="muted">The item gets a SKU and barcode label as soon as it is saved.</p>
<form class="card" method="post" action="/items" enctype="multipart/form-data">
  <label>Consignor<select name="consignor_id" required><option value="">Choose…</option>{% for c in consignors %}<option value="{{ c.id }}" {{ 'selected' if selected == c.id }}>{{ c.name }} ({{ c.code }})</option>{% endfor %}</select></label>
  {% set i = {} %}{% set staff_fields = true %}{% include "_item_fields.html" %}
  <div class="fields">
    <label>List price<input name="price" inputmode="decimal"></label>
    <label>Photos<input type="file" name="photos" accept="image/*" multiple></label>
  </div>
  <label class="check"><input type="checkbox" name="list_now" value="1" checked> List for sale now (when a price is set){% if square_on %} and send to Square{% endif %}</label>
  <div class="row"><button>Save</button><button class="ghost" name="another" value="1">Save and check in another</button></div>
</form>
{% endblock %}
