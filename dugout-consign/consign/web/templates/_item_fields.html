<div class="fields">
  <label style="grid-column:1/-1">Title<input name="title" value="{{ i.title or '' }}" required placeholder="2018 Topps Update Shohei Ohtani RC #US1 PSA 10"></label>
  <label>Category<input name="category" value="{{ i.category or '' }}" list="cats" placeholder="Graded card"></label>
  <label>Sport / game<input name="sport" value="{{ i.sport or '' }}" list="sports"></label>
  <label>Year<input name="year" value="{{ i.year or '' }}"></label>
  <label>Brand / set<input name="brand_set" value="{{ i.brand_set or '' }}"></label>
  <label>Card #<input name="card_number" value="{{ i.card_number or '' }}"></label>
  <label>Player / character<input name="subject" value="{{ i.subject or '' }}"></label>
  <label>Grader<input name="grader" value="{{ i.grader or '' }}" list="graders" placeholder="blank if raw"></label>
  <label>Grade<input name="grade" value="{{ i.grade or '' }}"></label>
  <label>Cert #<input name="cert_number" value="{{ i.cert_number or '' }}"></label>
  <label>Condition<input name="condition" value="{{ i.condition or '' }}" placeholder="Near Mint"></label>
  <label>Quantity<input name="quantity" type="number" min="1" value="{{ i.quantity or 1 }}"></label>
  <label>Asking price<input name="asking" value="{{ i.asking_cents | plain }}" inputmode="decimal"></label>
  <label>Floor (lowest OK)<input name="min" value="{{ i.min_cents | plain }}" inputmode="decimal"></label>
  {% if staff_fields %}
  <label>Commission % (blank = default)<input name="commission_pct" value="{{ '%g' % i.commission_pct if i.commission_pct is not none and i.commission_pct is defined else '' }}" inputmode="decimal"></label>
  <label>Case / shelf<input name="location" value="{{ i.location or '' }}"></label>
  <label>TCGplayer product id<input name="tcgplayer_id" value="{{ i.tcgplayer_id or '' }}"></label>
  {% endif %}
</div>
<label>Notes for the listing<textarea name="description">{{ i.description or '' }}</textarea></label>
<datalist id="cats"><option>Graded card</option><option>Raw card</option><option>Sealed</option><option>Autograph</option><option>Memorabilia</option><option>Lot</option></datalist>
<datalist id="sports"><option>Baseball</option><option>Basketball</option><option>Football</option><option>Hockey</option><option>Soccer</option><option>Pokemon</option><option>Magic</option><option>Yu-Gi-Oh</option><option>One Piece</option><option>Lorcana</option></datalist>
<datalist id="graders"><option>PSA</option><option>BGS</option><option>SGC</option><option>CGC</option><option>TAG</option></datalist>
