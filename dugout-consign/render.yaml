# Render Blueprint: Render reads this file and creates the portal for you.
# Render dashboard > New > Blueprint > pick this repository. See docs/SETUP_GUIDE.md, Part 2.
services:
  - type: web
    name: dugout-consign
    runtime: python
    plan: starter            # $7/month; the free plan sleeps and cannot keep a disk
    region: ohio
    buildCommand: pip install .
    startCommand: uvicorn consign.web.app:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data   # the database and photos live here; Render snapshots it daily
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CONSIGN_ENV
        value: production
      - key: CONSIGN_DATA_DIR
        value: /var/data
      - key: CONSIGN_SECRET_KEY
        generateValue: true
      - key: CONSIGN_SETUP_TOKEN
        generateValue: true
