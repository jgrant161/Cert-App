name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: certapp
          POSTGRES_PASSWORD: certapp
          POSTGRES_DB: certapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certapp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          CERTAPP_TEST_DATABASE_URL: postgresql://certapp:certapp@localhost:5432/certapp_test
