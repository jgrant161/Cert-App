{% extends "base.html" %}
{% block title %}Set your password · Certificate Review{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Welcome, {{ invitee.name }}</h1>
  <p class="muted">Choose a password for <b>{{ invitee.email }}</b>. This link works once.</p>
  {% if error %}<p class="notice bad-notice" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <label for="password">New password (at least 12 characters)
      <input id="password" name="password" type="password" autocomplete="new-password" required></label>
    <label for="confirm">Repeat password <input id="confirm" name="confirm" type="password" autocomplete="new-password" required></label>
    <button type="submit">Set password and sign in</button>
  </form>
</section>
{% endblock %}
